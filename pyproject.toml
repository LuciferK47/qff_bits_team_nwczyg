[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtrust"
version = "0.1.0"
description = "When can we trust a quantum simulation? Validated Trotter dynamics benchmark (BITS Goa / IBM Qiskit Fall Fest)"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
